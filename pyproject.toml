[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devrelay"
version = "0.5.1"
description = "Plan with one model, build with Codex, review with another - without copy-pasting between agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DevRelay contributors" }]
keywords = ["ai", "codex", "orchestrator", "review", "workflow", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/YingQiu0871/DevRelay"
Repository = "https://github.com/YingQiu0871/DevRelay"
Issues = "https://github.com/YingQiu0871/DevRelay/issues"
Changelog = "https://github.com/YingQiu0871/DevRelay/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# v0.3-B MCP tool surface: the official Model Context Protocol Python SDK.
# Constrained (not floor-only) because the 1.x -> 2.x rename of FastMCP to
# MCPServer changes the public API this adapter is written against.
mcp = ["mcp>=2.2,<3"]
# v0.4-A: local HTTP control API.  Kept optional so the core CLI stays small;
# `devrelay web serve` reports an actionable install hint when it is absent.
web = ["starlette>=0.37,<2", "uvicorn>=0.30,<1"]
dev = [
    "pytest>=8.0",
    "mcp>=2.2,<3",
    "starlette>=0.37,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
devrelay = "devrelay.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devrelay = ["profiles/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

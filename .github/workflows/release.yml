# PyPI publication for DevRelay (Trusted Publishing / OIDC).
#
# No PyPI API token is stored in this repository. PyPI matches the publisher by
# repository + workflow filename + environment, so all three are load-bearing:
#   repository: YingQiu0871/DevRelay
#   workflow:   release.yml   (renaming this file breaks the trusted publisher)
#   environment: pypi
#
# Flow: the release is prepared by hand as a DRAFT Release, and this workflow
# finishes it. It validates the dispatch tag, builds the distributions from that
# tag's own source, attaches the wheel, the sdist and SHA256SUMS to the draft,
# uploads the distributions to PyPI, and only then flips the draft to a
# published Release. A Release that is already published, or that is marked as a
# prerelease, is refused: the draft state is what makes "assets are attached
# before anyone can see it" checkable, and it is how the same release can be
# fixed by a rerun without ever showing a half-populated Release.
#
# Rerun semantics: the version is looked up on PyPI before anything is built.
# When it is already there, the build, checksum, twine, asset-upload and PyPI
# steps are all skipped and only the final step runs - which still requires all
# four release assets to be present before it publishes the Release. A rerun
# after a partial failure therefore never rebuilds a version PyPI already has,
# and never publishes a Release whose assets are missing.
#
# SHA256SUMS lives in release-assets/, never in dist/: a checksum file inside
# dist/ makes `twine check dist/*` fail, so the twine step names the
# distribution globs explicitly (`dist/*.whl dist/*.tar.gz`).
#
# build and twine are pinned to exact versions so a release cannot change
# behaviour because a tool released: build==1.6.1 and twine==7.0.0 (latest
# stable, queried 2026-10-18).
#
# Inputs reach the shell only through `env:`, never interpolated into `run:`
# text. The embedded Python lives in single-quoted shell variables (PYCODE='
# ... ') assigned by `python -c "$PYCODE"`, which keeps the code readable inside
# the YAML block scalar without any heredoc-terminator or escaping pitfalls.
#
# Action references are pinned to full commit SHAs (with the human-readable
# version in a trailing comment); Dependabot-style manual bumps are deliberate.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.4.0)"
        required: true
        default: "v0.4.0"
        type: string
      confirm:
        description: "Type exactly PUBLISH to confirm the PyPI upload"
        required: true
        default: ""
        type: string

permissions:
  contents: read

jobs:
  windows-portable:
    name: Build Windows portable
    if: ${{ inputs.confirm == 'PUBLISH' }}
    concurrency:
      group: windows-portable-${{ inputs.tag }}
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Record the checked-out commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-assets -Force | Out-Null
          git rev-parse HEAD | Out-File -FilePath windows-assets/COMMIT_SHA.txt -Encoding ascii
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install --quiet "build==1.6.1" "pyinstaller==6.15.0" ".[web]"
          python -m build --wheel --outdir dist
          python scripts/build_portable.py --version "$env:VERSION" --dist dist --output windows-assets
      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable
          path: windows-assets/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (OIDC)
    needs: windows-portable
    if: ${{ inputs.confirm == 'PUBLISH' }}
    # Two dispatches for the same tag must not interleave: the second one has to
    # see the first one's result (PyPI state, draft assets) rather than race it.
    # This is job-level because `inputs` is only reliably in scope there.
    concurrency:
      group: release-${{ inputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate the tag shape
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag $TAG has the expected vMAJOR.MINOR.PATCH shape"

      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Download the Windows portable artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-portable
          path: windows-assets

      - name: Verify the Windows artifact came from this commit
        run: |
          set -euo pipefail
          local_sha=$(git rev-parse HEAD)
          artifact_sha=$(tr -d '\r\n' < windows-assets/COMMIT_SHA.txt)
          if [ "$local_sha" != "$artifact_sha" ]; then
            echo "::error::portable artifact was built from $artifact_sha, wheel tag is $local_sha; refusing to mix commits."
            exit 1
          fi
          echo "portable artifact matches the checked-out commit $local_sha"

      - name: Validate the tag against pyproject
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PYCODE='
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["TAG"]
          assert tag == f"v{version}", f"tag {tag} does not match pyproject version {version}"
          print(version)
          '
          version=$(python -c "$PYCODE")
          echo "tag $TAG matches pyproject version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is reachable from origin/main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" FETCH_HEAD; then
            echo "::error::$TAG is not reachable from origin/main; refusing to publish an unmerged tag."
            exit 1
          fi

      - name: Verify the GitHub Release is a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq 'if .isDraft then (if .isPrerelease then "prerelease" else "draft" end) else "not-a-draft" end')
          if [ "$state" != "draft" ]; then
            echo "::error::release $TAG is $state; this workflow only publishes a draft Release."
            echo "::error::create the draft Release first: gh release create \"$TAG\" --draft --title \"devrelay $TAG\" --notes-file <notes>"
            exit 1
          fi
          echo "release $TAG is an unpublished draft and is not marked prerelease"

      - name: Check whether this version is already on PyPI
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PYPI_JSON: ${{ runner.temp }}/pypi-devrelay-${{ steps.version.outputs.version }}.json
        run: |
          set -euo pipefail
          status=$(curl -sS --retry 3 -o "$PYPI_JSON" -w '%{http_code}' "https://pypi.org/pypi/devrelay/${VERSION}/json")
          case "$status" in
            200) ;;
            404)
              echo "devrelay ${VERSION} is not on PyPI yet; the distributions will be built and uploaded."
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::unexpected PyPI status $status for devrelay ${VERSION}; refusing to continue."
              exit 1
              ;;
          esac
          PYCODE='
          import json, os, pathlib, sys

          version = os.environ["VERSION"]
          try:
              payload = json.loads(pathlib.Path(os.environ["PYPI_JSON"]).read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              sys.exit(f"::error::cannot read the PyPI JSON response at {os.environ['PYPI_JSON']}: {exc}")
          names = [str(entry.get("filename", "")) for entry in payload.get("urls", [])]
          wheels = sorted(name for name in names if name.endswith(".whl"))
          sdists = sorted(name for name in names if name.endswith(".tar.gz"))
          if not wheels and not sdists:
              print("false")
              sys.exit(0)
          wheel_ok = len(wheels) == 1 and f"devrelay-{version}" in wheels[0]
          sdist_ok = len(sdists) == 1 and f"devrelay-{version}" in sdists[0]
          if wheel_ok and sdist_ok:
              print("true")
              sys.exit(0)
          missing = []
          if not wheel_ok:
              missing.append(f"devrelay-{version}-py3-none-any.whl")
          if not sdist_ok:
              missing.append(f"devrelay-{version}.tar.gz")
          print(f"::error::partial PyPI upload detected for devrelay {version}: PyPI lists {names}; missing {missing}.", file=sys.stderr)
          print("::error::PyPI files are immutable: do not rebuild and re-upload the version. Upload the missing file(s) to PyPI by hand, then rerun this workflow - never bypass this probe.", file=sys.stderr)
          sys.exit(1)
          '
          exists=$(python -c "$PYCODE")
          if [ "$exists" != "true" ]; then
            echo "::error::PyPI answers 200 for devrelay ${VERSION} but lists no release files; refusing to continue."
            exit 1
          fi
          echo "devrelay ${VERSION} is already on PyPI with one wheel and one sdist; the build and upload steps will be skipped."
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Build the distributions from source
        if: steps.pypi.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet "build==1.6.1" "twine==7.0.0"
          rm -rf dist build release-assets
          python -m build --outdir dist

      - name: Check the artifact set and write checksums
        if: steps.pypi.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          PYCODE='
          import hashlib, pathlib, sys, tarfile, zipfile
          dist = pathlib.Path("dist")
          assets = pathlib.Path("release-assets")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected exactly one wheel and one sdist, got {wheels} / {sdists}")
          wheel_names = zipfile.ZipFile(wheels[0]).namelist()
          sdist_names = tarfile.open(sdists[0]).getnames()
          for label, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              if not any(n.endswith("devrelay/profiles/default.yaml") for n in names):
                  sys.exit(f"{label} is missing devrelay/profiles/default.yaml")
          portable = pathlib.Path("windows-assets/DevRelay-Portable-Windows-x64.zip")
          if not portable.is_file():
              sys.exit(f"Windows portable artifact is missing: {portable}")
          digests = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in wheels + sdists + [portable]
          }
          for name, digest in digests.items():
              print(f"{digest}  {name}")
          (assets / "SHA256SUMS").write_text(
              "".join(f"{digest}  {name}" + chr(10) for name, digest in digests.items()),
              encoding="utf-8",
          )
          print("artifact verification OK: one wheel, one sdist, portable zip, profiles/default.yaml packaged")
          '
          python -c "$PYCODE"

      - name: twine check
        if: steps.pypi.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Attach the distributions and checksums to the draft release
        if: steps.pypi.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz release-assets/SHA256SUMS windows-assets/DevRelay-Portable-Windows-x64.zip --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          attestations: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PYPI_EXISTS: ${{ steps.pypi.outputs.exists }}
        run: |
          set -euo pipefail
          present=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=()
          for asset in "devrelay-${VERSION}-py3-none-any.whl" "devrelay-${VERSION}.tar.gz" "SHA256SUMS" "DevRelay-Portable-Windows-x64.zip"; do
            if ! printf '%s\n' "$present" | grep -Fxq "$asset"; then
              echo "::error::draft release $TAG has no asset named $asset; refusing to publish it."
              missing+=("$asset")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${PYPI_EXISTS:-}" = "true" ]; then
              echo "::error::devrelay ${VERSION} is already on PyPI, so this run skipped the rebuild by design: do not rebuild the distributions. Restore the missing draft assets from the release you already published, then rerun this workflow: gh release upload \"$TAG\" ${missing[*]} --clobber --repo \"$GITHUB_REPOSITORY\""
            else
              echo "::error::rerun this workflow with tag $TAG so the build and attach steps run again."
            fi
            exit 1
          fi
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

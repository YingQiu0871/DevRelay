# PyPI publication for DevRelay (Trusted Publishing / OIDC).
#
# No PyPI API token is stored in this repository. PyPI matches the publisher by
# repository + workflow filename + environment, so all three are load-bearing:
#   repository: YingQiu0871/DevRelay
#   workflow:   release.yml   (renaming this file breaks the trusted publisher)
#   environment: pypi
#
# Flow: the release is prepared by hand as a DRAFT Release, and this workflow
# finishes it. It validates the dispatch tag, builds the distributions from that
# tag's own source, attaches the wheel, the sdist and SHA256SUMS to the draft,
# uploads the distributions to PyPI, and only then flips the draft to a
# published Release. A Release that is already published, or that is marked as a
# prerelease, is refused: the draft state is what makes "assets are attached
# before anyone can see it" checkable, and it is how the same release can be
# fixed by a rerun without ever showing a half-populated Release.
#
# Rerun semantics: the version is looked up on PyPI before anything is built.
# When it is already there, the build, checksum, twine, asset-upload and PyPI
# steps are all skipped and only the final step runs - which still requires all
# three release assets to be present before it publishes the Release. A rerun
# after a partial failure therefore never rebuilds a version PyPI already has,
# and never publishes a Release whose assets are missing.
#
# SHA256SUMS lives in release-assets/, never in dist/: a checksum file inside
# dist/ makes `twine check dist/*` fail, so the twine step names the
# distribution globs explicitly (`dist/*.whl dist/*.tar.gz`).
#
# build and twine are pinned to exact versions so a release cannot change
# behaviour because a tool released: build==1.6.1 and twine==7.0.0 (latest
# stable, queried 2026-10-18).
#
# Inputs reach the shell only through `env:`, never interpolated into `run:`
# text. The embedded Python lives in single-quoted shell variables (PYCODE='
# ... ') assigned by `python -c "$PYCODE"`, which keeps the code readable inside
# the YAML block scalar without any heredoc-terminator or escaping pitfalls.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.3.0)"
        required: true
        default: "v0.3.0"
        type: string
      confirm:
        description: "Type exactly PUBLISH to confirm the PyPI upload"
        required: true
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI (OIDC)
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Validate the tag shape
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag $TAG has the expected vMAJOR.MINOR.PATCH shape"

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate the tag against pyproject
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          PYCODE='
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["TAG"]
          assert tag == f"v{version}", f"tag {tag} does not match pyproject version {version}"
          print(version)
          '
          version=$(python -c "$PYCODE")
          echo "tag $TAG matches pyproject version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is reachable from origin/main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" FETCH_HEAD; then
            echo "::error::$TAG is not reachable from origin/main; refusing to publish an unmerged tag."
            exit 1
          fi

      - name: Verify the GitHub Release is a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq 'if .isDraft then (if .isPrerelease then "prerelease" else "draft" end) else "not-a-draft" end')
          if [ "$state" != "draft" ]; then
            echo "::error::release $TAG is $state; this workflow only publishes a draft Release."
            echo "::error::create the draft Release first: gh release create \"$TAG\" --draft --title \"devrelay $TAG\" --notes-file <notes>"
            exit 1
          fi
          echo "release $TAG is an unpublished draft and is not marked prerelease"

      - name: Check whether this version is already on PyPI
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/devrelay/${VERSION}/json")
          case "$status" in
            200) exists=true ;;
            404) exists=false ;;
            *)
              echo "::error::unexpected PyPI status $status for devrelay ${VERSION}; refusing to continue."
              exit 1
              ;;
          esac
          echo "devrelay ${VERSION} already on PyPI: $exists"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Build the distributions from source
        if: steps.pypi.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet "build==1.6.1" "twine==7.0.0"
          rm -rf dist build release-assets
          python -m build --outdir dist

      - name: Check the artifact set and write checksums
        if: steps.pypi.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          PYCODE='
          import hashlib, pathlib, sys, tarfile, zipfile
          dist = pathlib.Path("dist")
          assets = pathlib.Path("release-assets")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected exactly one wheel and one sdist, got {wheels} / {sdists}")
          wheel_names = zipfile.ZipFile(wheels[0]).namelist()
          sdist_names = tarfile.open(sdists[0]).getnames()
          for label, names in (("wheel", wheel_names), ("sdist", sdist_names)):
              if not any(n.endswith("devrelay/profiles/default.yaml") for n in names):
                  sys.exit(f"{label} is missing devrelay/profiles/default.yaml")
          digests = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in wheels + sdists}
          for name, digest in digests.items():
              print(f"{digest}  {name}")
          (assets / "SHA256SUMS").write_text(
              "".join(f"{digest}  {name}" + chr(10) for name, digest in digests.items()),
              encoding="utf-8",
          )
          print("artifact verification OK: one wheel, one sdist, profiles/default.yaml packaged")
          '
          python -c "$PYCODE"

      - name: twine check
        if: steps.pypi.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Attach the distributions and checksums to the draft release
        if: steps.pypi.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz release-assets/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          present=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "devrelay-${VERSION}-py3-none-any.whl" "devrelay-${VERSION}.tar.gz" "SHA256SUMS"; do
            if ! printf '%s\n' "$present" | grep -Fxq "$asset"; then
              echo "::error::draft release $TAG has no asset named $asset; refusing to publish it."
              exit 1
            fi
          done
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
